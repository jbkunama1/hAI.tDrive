version: "3.8"

services:
  tdrive:
    image: ghcr.io/jbkunama1/hai.trive:latest
    container_name: tdrive
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD=${PASSWORD}
      - TELEGRAM_DRIVE_BASE_URL=${TELEGRAM_DRIVE_BASE_URL}
      - TELEGRAM_DRIVE_API_KEY=${TELEGRAM_DRIVE_API_KEY}
      - PORT=8080
    networks:
      - highfishNetwork
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  highfishNetwork:
    external: true
